 document.querySelectorAll('li.on,li.x').forEach(l=>l.classList.remove('on','x'));
 const c=clueFor(cr,cc,dir),od=dir==='A'?'D':'A',o=wordOf(cr,cc,od).length>1?clueFor(cr,cc,od):null;
 if(c){const li=document.getElementById(dir+c[0]);li.classList.add('on');scrollLi(li);
  document.getElementById('cbn').textContent=c[0]+dir;document.getElementById('cbt').innerHTML=fmt(c);document.getElementById('mct').innerHTML=fmt(c)}
 if(o){const li=document.getElementById(od+o[0]);li.classList.add('x');scrollLi(li)}
 D.across.concat(D.down).forEach((c,k)=>{const d=k<D.across.length?'A':'D';const L=wordOf(c[1],c[2],d);document.getElementById(d+c[0]).classList.toggle('done',L.every(([a,b])=>fill[a][b]))})}
function scrollLi(li){const ol=li.parentNode;if(ol.scrollHeight<=ol.clientHeight)return;const t=li.offsetTop-ol.offsetTop;if(t<ol.scrollTop||t+li.offsetHeight>ol.scrollTop+ol.clientHeight)ol.scrollTop=t-ol.clientHeight/3}
function select(i,j,click){if(click&&i===cr&&j===cc)dir=dir==='A'?'D':'A';cr=i;cc=j;paint();fk()}
function set(i,j,v){if(cells[i][j].classList.contains('ok')&&v!==fill[i][j]&&v!==R[i][j])return;fill[i][j]=v;cells[i][j].querySelector('.v').textContent=v;cells[i][j].classList.remove('wrong');if(!v)cells[i][j].classList.remove('rev','ok')}
function step(k){let i=cr,j=cc;do{dir==='A'?j+=k:i+=k}while(i>=0&&j>=0&&i<N&&j<N&&R[i][j]==='#');if(i>=0&&j>=0&&i<N&&j<N){cr=i;cc=j}}
function advance(){const L=wordOf(cr,cc,dir);const k=L.findIndex(([a,b])=>a===cr&&b===cc);
 for(let t=k+1;t<L.length;t++){const [a,b]=L[t];if(!fill[a][b]){cr=a;cc=b;return}}if(k<L.length-1){[cr,cc]=L[k+1]}}
function onKey(e){if(paused)return;const k=e.key;
 if(/^[a-zA-Z]$/.test(k)){set(cr,cc,k.toUpperCase());advance();paint();checkDone();e.preventDefault()}
 else if(k==='Backspace'){if(!fill[cr][cc])step(-1);set(cr,cc,'');paint();e.preventDefault()}
 else if(k==='Delete'){set(cr,cc,'');paint();e.preventDefault()}
 else if(k.startsWith('Arrow')){const d=(k==='ArrowLeft'||k==='ArrowRight')?'A':'D';if(d!==dir){dir=d}else step(k==='ArrowRight'||k==='ArrowDown'?1:-1);paint();e.preventDefault()}
 else if(k==='Tab'||k==='Enter'){tabTo(e.shiftKey);paint();e.preventDefault()}
 else if(k===' '){dir=dir==='A'?'D':'A';paint();e.preventDefault()}}
function seq(d){const out=[];(d==='A'?D.across:D.down).forEach(c=>{for(let t=0;t<c[3];t++)out.push(d==='A'?[c[1],c[2]+t]:[c[1]+t,c[2]])});return out}
function tabTo(back){
 const starts=(dir==='A'?D.across:D.down);let i=starts.indexOf(clueFor(cr,cc,dir));
 i=(i+(back?-1:1)+starts.length)%starts.length;const c=starts[i];
 for(let t=0;t<c[3];t++){const a=dir==='A'?c[1]:c[1]+t,b=dir==='A'?c[2]+t:c[2];if(!fill[a][b]){cr=a;cc=b;return}}
 cr=c[1];cc=c[2]}
kbd.addEventListener('keydown',onKey);document.addEventListener('keydown',e=>{if(e.target!==kbd&&!e.metaKey&&!e.ctrlKey&&!e.altKey)onKey(e)});
function list(id,arr,d){const ol=document.getElementById(id);arr.forEach(c=>{const li=document.createElement('li');li.id=d+c[0];li.innerHTML='<b>'+c[0]+'</b><span>'+fmt(c)+'</span>';li.onclick=()=>{dir=d;select(c[1],c[2]);document.querySelector('.clues').classList.remove('open')};ol.appendChild(li)})}
list('ca',D.across,'A');list('cd',D.down,'D');
/* timer */
let secs=0,paused=false;const tEl=document.getElementById('time'),pBtn=document.getElementById('pause');
const tick=()=>{tEl.textContent=mt.textContent=Math.floor(secs/3600)?Math.floor(secs/3600)+':'+String(Math.floor(secs/60)%60).padStart(2,'0')+':'+String(secs%60).padStart(2,'0'):Math.floor(secs/60)+':'+String(secs%60).padStart(2,'0')};
setInterval(()=>{if(!paused&&!solved&&!document.hidden){secs++;tick()}},1000);
pBtn.onclick=()=>{paused=!paused;pBtn.classList.toggle('paused',paused);document.getElementById('main').classList.toggle('paused',paused);if(!paused)fk()};
/* menus */
document.querySelectorAll('.menu>button').forEach(b=>b.onclick=e=>{e.stopPropagation();const m=b.parentNode,o=m.classList.contains('open');document.querySelectorAll('.menu').forEach(x=>x.classList.remove('open'));if(!o)m.classList.add('open')});
document.addEventListener('click',()=>document.querySelectorAll('.menu,.pop').forEach(x=>x.classList.remove('open')));
const all=()=>{const L=[];for(let i=0;i<N;i++)for(let j=0;j<N;j++)if(R[i][j]!=='#')L.push([i,j]);return L};
const scope=w=>w==='square'?[[cr,cc]]:w==='word'?wordOf(cr,cc,dir):all();
function act(a){const [v,w]=a.split('-');
 if(v==='clear'){(w==='word'?wordOf(cr,cc,dir):all()).forEach(([i,j])=>{cells[i][j].classList.remove('ok','rev');set(i,j,'')});if(w==='all'){secs=0;solved=false;tick()}}
 if(v==='reveal')scope(w).forEach(([i,j])=>{if(fill[i][j]!==R[i][j]){set(i,j,R[i][j]);cells[i][j].classList.add('rev')}});
 if(v==='check')scope(w).forEach(([i,j])=>{if(fill[i][j]){if(fill[i][j]===R[i][j])cells[i][j].classList.add('ok');else cells[i][j].classList.add('wrong')}});
 paint();if(v==='reveal')checkDone(true);fk()}
document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>act(b.dataset.a));
function checkDone(quiet){if(solved)return;if(all().every(([i,j])=>fill[i][j]===R[i][j])){solved=true;if(quiet)return;
 document.getElementById('tmsg').textContent='Finished in '+tEl.textContent+'. Happy twentieth.';document.getElementById('toast').style.display='block'}}
/* phone */
const KB=document.getElementById('mkb');
['QWERTYUIOP','ASDFGHJKL','*ZXCVBNM<'].forEach(r=>{const row=document.createElement('div');row.className='row';[...r].forEach(ch=>{const b=document.createElement('button');
 if(ch==='*'){b.textContent='More';b.className='wide';b.dataset.k='more'}else if(ch==='<'){b.className='wide';b.dataset.k='Backspace';b.setAttribute('aria-label','Delete');b.innerHTML='<svg viewBox="0 0 30 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M9 2h19v18H9L1 11z"/><path d="M14 7l8 8M22 7l-8 8"/></svg>'}else{b.textContent=ch;b.dataset.k=ch.toLowerCase()}row.appendChild(b)});KB.appendChild(row)});
KB.addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(!b)return;e.preventDefault();e.stopPropagation();closePops();
 if(b.dataset.k==='more'){togglePop('pop-help');return}onKey({key:b.dataset.k,shiftKey:false,preventDefault(){}})});
KB.addEventListener('click',e=>e.stopPropagation());
const order=D.across.map(c=>['A',c]).concat(D.down.map(c=>['D',c]));
function nav(st){const c=clueFor(cr,cc,dir);let i=order.findIndex(([d,x])=>d===dir&&x===c);i=(i+st+order.length)%order.length;dir=order[i][0];cr=order[i][1][1];cc=order[i][1][2];paint()}
const closePops=()=>document.querySelectorAll('.pop').forEach(x=>x.classList.remove('open'));
function togglePop(id){const p=document.getElementById(id),o=p.classList.contains('open');closePops();document.querySelector('.clues').classList.remove('open');if(!o)p.classList.add('open')}
const on=(id,fn)=>document.getElementById(id).addEventListener('click',e=>{e.stopPropagation();fn()});
on('mprev',()=>{closePops();nav(-1)});on('mnext',()=>{closePops();nav(1)});on('mct',()=>{closePops();dir=dir==='A'?'D':'A';paint()});
on('mhelp',()=>togglePop('pop-help'));on('minfo',()=>togglePop('pop-info'));
on('mlist',()=>{closePops();document.querySelector('.clues').classList.toggle('open');paint()});
on('mpause',()=>pBtn.click());
document.querySelectorAll('.pop').forEach(p=>p.addEventListener('click',e=>{e.stopPropagation();if(e.target.closest('[data-a]'))closePops()}));
const syncKb=()=>{if(isM()){kbd.setAttribute('inputmode','none');kbd.setAttribute('readonly','');kbd.blur()}else{kbd.removeAttribute('inputmode');kbd.removeAttribute('readonly')}};syncKb();addEventListener('resize',syncKb);
tick();select(0,0);
</script></body></html>
